name: Teste de cadastro e login de eleitores

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-integracao-eleitores:
    runs-on: windows-latest
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
      FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Conferir secrets do Firebase
        shell: powershell
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_API_KEY)) { $missing += 'FIREBASE_API_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_DATABASE_URL)) { $missing += 'FIREBASE_DATABASE_URL' }
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_EMAIL)) { $missing += 'FIREBASE_EMAIL' }
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_PASSWORD)) { $missing += 'FIREBASE_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Configure estes GitHub Actions secrets para executar o teste: $($missing -join ', ')"
          }

      - name: Gerar o Gradle Wrapper
        shell: powershell
        run: gradle wrapper --gradle-version 8.7

      - name: Executar teste de integração do eleitor
        shell: powershell
        run: .\gradlew.bat test --no-daemon
